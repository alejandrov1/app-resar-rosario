name: app_resar_rosario
description: "Una aplicación para rezar el Santo Rosario."
publish_to: 'none'
version: 1.0.0+1

environment:
  # Actualizamos el SDK para que sea compatible con los plugins más recientes
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # --- DEPENDENCIAS ACTUALIZADAS ---
  # Estas son las versiones que resolverán los errores de compilación
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.2.3
  flutter_local_notifications: ^17.2.1+1
  permission_handler: ^11.3.1
  file_picker: ^8.0.6  # La versión moderna que necesitamos
  path_provider: ^2.1.3
  intl: ^0.19.0
  provider: ^6.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icons/icono-rosario.png"
  min_sdk_android: 21