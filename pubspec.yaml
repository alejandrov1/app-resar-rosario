name: app_resar_rosario
description: "Una aplicación para rezar el Santo Rosario."
publish_to: 'none' 
version: 1.0.0+1

environment:
  sdk: '>=3.4.1 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  shared_preferences: ^2.2.3
  flutter_local_notifications: ^17.2.2 
  permission_handler: ^11.3.1        
  timezone: ^0.9.4                   
  intl: ^0.19.0
  provider: ^6.1.5
  flutter_launcher_icons: "^0.13.1"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/icono-rosario.png"
  min_sdk_android: 21
  
  # Configuración específica para Android
  android_adaptive_icon_background: "#FFFFFF"
  android_adaptive_icon_foreground: "assets/icons/icono-rosario.png"
  
  # Configuración específica para iOS
  ios_marketing_scale: 1
  remove_alpha_ios: true
  
  # Configuración para Web
  web:
    generate: true
    image_path: "assets/icons/icono-rosario.png"
    background_color: "#FFFFFF"
    theme_color: "#1E3A8A"