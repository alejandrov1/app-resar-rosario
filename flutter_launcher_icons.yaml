flutter_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icons/icono-rosario.png"
  min_sdk_android: 21
  
  # SOLUCIÓN: Configuración para Android adaptativo 
  # Fondo sólido blanco y foreground con la imagen del rosario
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icons/icono-rosario.png"
  
  # Generar iconos para web
  web:
    generate: true
    image_path: "assets/icons/icono-rosario.png"
    background_color: "#FFFFFF"
    theme_color: "#2563EB"
  
  # Configuración para Windows
  windows:
    generate: true
    image_path: "assets/icons/icono-rosario.png"
    icon_size: 48
  
  # Configuración para macOS  
  macos:
    generate: true
    image_path: "assets/icons/icono-rosario.png"