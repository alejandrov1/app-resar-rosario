# Configuración alternativa para iconos seguros (sin cortes)
flutter_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icons/icono-rosario.png"
  min_sdk_android: 21
  
  # SOLUCIÓN: Usar adaptive icons para Android
  # El adaptive icon tendrá un fondo blanco y el rosario como foreground
  adaptive_icon_background: "#F3F4F6"  # Gris muy claro
  adaptive_icon_foreground: "assets/icons/icono-rosario.png"
  
  # Para iOS, usar el icono tal como está (ya que iOS maneja mejor los bordes)
  ios: true
  
  # Generar para todas las plataformas
  web:
    generate: true
    image_path: "assets/icons/icono-rosario.png"
    background_color: "#F3F4F6"
    theme_color: "#2563EB"
  
  windows:
    generate: true
    image_path: "assets/icons/icono-rosario.png"
    icon_size: 48
  
  macos:
    generate: true
    image_path: "assets/icons/icono-rosario.png"